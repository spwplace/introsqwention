[package]
name = "introsqwention"
version = "0.1.0"
edition = "2021"
description = "Activation-level introspection server with live dashboard for transformer models"
license = "MIT"

[[bin]]
name = "introspect"
path = "src/main.rs"

[[bin]]
name = "introspect-cli"
path = "src/cli.rs"

[dependencies]
mistralrs-core = { path = "mistral-introspect/mistralrs-core" }
candle-core = "0.9.2"
candle-nn = "0.9.2"
rand = "0.9.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
anyhow = "1.0.100"
tokio = { version = "1.49.0", features = ["full", "rt-multi-thread"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
clap = { version = "4.5.54", features = ["derive", "wrap_help"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors", "fs"] }
uuid = { version = "1", features = ["v4"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
indicatif = "0.17"
futures-core = "0.3"
async-stream = "0.3"
rusqlite = { version = "0.34", features = ["bundled"] }

[features]
default = []
metal = ["candle-core/metal", "mistralrs-core/metal"]
cuda = ["candle-core/cuda", "mistralrs-core/cuda"]

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 3
